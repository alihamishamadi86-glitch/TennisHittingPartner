name: Deploy

# Staging defaults come from `terraform output` (see infra/README.md). None of them are
# sensitive; override with Actions variables (GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER,
# GCP_DEPLOYER_SA) if the environment is rebuilt.
#
# Feature switches, from Actions variables or secrets (Settings → Secrets and variables →
# Actions, on the repo or the "staging" environment). Both default to "false":
#   PAYMENTS_ENABLED  true = checkout via Stripe; false = bookings confirm with no online payment
#   SMS_ENABLED       true = text reminders and phone verification; false = email only

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'deft-idiom-510807-q8' }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      TAG: ${{ github.sha }}
      # A variable wins; a repository/environment secret of the same name also works.
      PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED || secrets.PAYMENTS_ENABLED || 'false' }}
      SMS_ENABLED: ${{ vars.SMS_ENABLED || secrets.SMS_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/1050136558690/locations/global/workloadIdentityPools/github/providers/github-oidc' }}
          service_account: ${{ vars.GCP_DEPLOYER_SA || 'thp-deployer@deft-idiom-510807-q8.iam.gserviceaccount.com' }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push images
        run: |
          exec > >(tee -a "$RUNNER_TEMP/deploy.log") 2>&1
          REGISTRY="${REGION}-docker.pkg.dev/${PROJECT_ID}/thp-images"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$REGISTRY/api:$TAG" api
          docker build -t "$REGISTRY/web:$TAG" web
          docker push "$REGISTRY/api:$TAG"
          docker push "$REGISTRY/web:$TAG"

      - name: Run database migrations
        run: |
          exec > >(tee -a "$RUNNER_TEMP/deploy.log") 2>&1
          gcloud run jobs update thp-migrate --region "$REGION" --image "$REGISTRY/api:$TAG"
          gcloud run jobs execute thp-migrate --region "$REGION" --wait
          gcloud run jobs update thp-manage --region "$REGION" --image "$REGISTRY/api:$TAG"

      - name: Deploy services
        run: |
          exec > >(tee -a "$RUNNER_TEMP/deploy.log") 2>&1
          for name in PAYMENTS_ENABLED SMS_ENABLED; do
            value=$(tr '[:upper:]' '[:lower:]' <<<"${!name}")
            [[ "$value" == true || "$value" == false ]] || {
              echo "::error::Actions variable $name must be true or false (got '${!name}')"; exit 1; }
            printf -v "$name" '%s' "$value"
          done
          FLAGS="PAYMENTS_ENABLED=$PAYMENTS_ENABLED,SMS_ENABLED=$SMS_ENABLED"
          echo "Feature flags: $FLAGS"
          gcloud run deploy thp-worker --region "$REGION" --image "$REGISTRY/api:$TAG" --update-env-vars "$FLAGS"
          gcloud run deploy thp-api    --region "$REGION" --image "$REGISTRY/api:$TAG" --update-env-vars "$FLAGS"
          gcloud run deploy thp-web    --region "$REGION" --image "$REGISTRY/web:$TAG"

      - name: Smoke test event pipeline
        run: |
          exec > >(tee -a "$RUNNER_TEMP/deploy.log") 2>&1
          API_URL=$(gcloud run services describe thp-api --region "$REGION" --format 'value(status.url)')
          ./scripts/smoke_ping.sh "$API_URL"

      # Job logs require GitHub sign-in; annotations are readable through the public API.
      - name: Report failure output
        if: failure()
        run: |
          tail -n 40 "$RUNNER_TEMP/deploy.log" 2>/dev/null \
            | python3 -c 'import sys; t=sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print(f"::error title=Deploy output::{t}")'
