# Local development stack. Mirrors the GCP topology:
#   Cloud SQL  -> db (PostGIS)      Pub/Sub -> pubsub emulator (push subs → worker)
#   Cloud Run  -> api, worker       Email   -> mailpit (UI on :8025)
# Next.js runs on the host: `cd web && npm run dev`.

x-api-env: &api-env
  ENVIRONMENT: local
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://thp:thp@db:5432/thp
  GCP_PROJECT_ID: thp-local
  PUBSUB_EMULATOR_HOST: pubsub:8085
  PUBLIC_WEB_URL: http://localhost:3000
  EMAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # Optional: put GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET in a root .env file to enable Google
  # sign-in locally (redirect URI: http://localhost:3000/api/auth/google/callback).
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  STORAGE_BACKEND: local
  # Optional: Geoapify key (free tier) in the root .env; without it the free OSM services
  # (Nominatim geocoding + Overpass) are used.
  GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
  # Feature switches (off by default, like the cloud). Set PAYMENTS_ENABLED=true / SMS_ENABLED=true
  # in the root .env to try checkout or texts locally.
  PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
  SMS_ENABLED: ${SMS_ENABLED:-false}
  # Texts are logged by the worker locally; set SMS_BACKEND=twilio + TWILIO_* in .env to send.
  SMS_BACKEND: ${SMS_BACKEND:-console}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  # Optional: Brave Search API key to find club websites OSM/Wikidata don't list.
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  # Payments: "fake" simulates checkout. For Stripe test mode put PAYMENT_PROVIDER=stripe,
  # STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY and STRIPE_WEBHOOK_SECRET in the root .env.
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  LOCAL_STORAGE_DIR: /srv/media

services:
  db:
    image: imresamu/postgis:16-3.5 # multi-arch drop-in for postgis/postgis (arm64 support)
    environment:
      POSTGRES_USER: thp
      POSTGRES_PASSWORD: thp
      POSTGRES_DB: thp
    ports: ["55432:5432"] # 55432 avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thp -d thp"]
      interval: 3s
      timeout: 3s
      retries: 20

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --project=thp-local --host-port=0.0.0.0:8085
    ports: ["8085:8085"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  migrate:
    build: ./api
    command: alembic upgrade head
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }

  pubsub-init:
    build: ./api
    command: python -m scripts.pubsub_bootstrap
    environment:
      <<: *api-env
      WORKER_PUSH_ENDPOINT: http://worker:8001/pubsub/push
    depends_on:
      pubsub: { condition: service_healthy }

  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *api-env
    ports: ["8000:8000"]
    volumes: ["./api/app:/srv/app:ro", "media:/srv/media"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pubsub-init: { condition: service_completed_successfully }

  worker:
    build: ./api
    command: uvicorn app.worker:app --host 0.0.0.0 --port 8001 --reload
    environment:
      <<: *api-env
      OUTBOX_RELAY_INTERVAL_SECONDS: "2"
    ports: ["8001:8001"]
    volumes: ["./api/app:/srv/app:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  media:
